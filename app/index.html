<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Trung tâm điều hành giám sát thông minh VPTWD</title>
<style>
:root{--red:#B9000E;--navy:#17204A;--muted:#64748b;--bg:#f4f5f8;--line:#E5E8EF}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--navy)}
.banner{background:#7f1d1d;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:7px}
header.top{background:var(--red);color:#fff;padding:10px 16px}
.t1{font-size:11px;opacity:.92}.t2{font-weight:800}
nav.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
nav.row a{color:#fff;text-decoration:none;font-size:13px}
nav.row a.on{text-decoration:underline;font-weight:700}
main{max-width:1100px;margin:20px auto;padding:0 16px 48px}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.muted{color:var(--muted);font-size:13px}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
input{padding:8px;border:1px solid #ddd;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:20px;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;background:#fff3f3;color:var(--red);font-size:11px;padding:2px 6px;border-radius:4px}
.stamp{font-size:11px;color:var(--muted)}
</style></head>
<body>
<div class="banner">BẢN NGHIÊN CỨU KIẾN TRÚC — DỮ LIỆU MẪU — không kết nối SSO / API ioc.dcs.vn</div>
<div id="app"></div>
<script>
const NAV=[["#/","Trang chủ"],["#/socio-economic","Kinh tế - Xã hội"],["#/operation-management","Điều hành tác nghiệp"],["#/hundred-day-plan","Kế hoạch 100 ngày"],["#/monitoring-resolution","Theo dõi nghị quyết"],["#/party-building","Dữ liệu Đảng viên"],["#/nnmt","Dữ liệu NNMT"],["#/system-monitoring","Giám sát hệ thống"],["#/admin/user","Quản trị hệ thống"]];
function chrome(t,b){const h=location.hash||"#/";return `<header class="top"><div class="t1">Văn phòng Trung ương Đảng</div><div class="t2">Trung tâm điều hành giám sát thông minh VPTWD</div><nav class="row">${NAV.map(([href,l])=>`<a class="${h===href?"on":""}" href="${href}">${l}</a>`).join("")}</nav></header><main><p class="stamp">S6 Đảng viên · 22/09/2026 · DỮ LIỆU MẪU</p><h1 style="font-size:20px">${t}</h1>${b}</main>`;}
function home(){return `<div class="grid"><div class="kpi"><span class="muted">GDP</span><b>+7,25%</b></div><div class="kpi"><span class="muted">Nhiệm vụ HT</span><b>64,1%</b></div><div class="kpi"><span class="muted">H100</span><b>48 NV</b></div><div class="kpi"><span class="muted">Đảng viên</span><b>4.862.000</b></div></div>`;}
function sePage(){return `<div class="card"><h2>KT-XH <span class="tag">DỮ LIỆU MẪU</span></h2><div class="grid"><div class="kpi"><span class="muted">GDP</span><b>+7,25%</b></div><div class="kpi"><span class="muted">CPI</span><b>+4,10%</b></div></div></div>`;}
function opsPage(){return `<div class="grid"><div class="kpi"><span class="muted">Nhiệm vụ HT</span><b>64,1%</b></div><div class="kpi"><span class="muted">Ký số</span><b>88,6%</b></div></div>`;}
function hdpPage(){return `<div class="grid"><div class="kpi"><span class="muted">Tổng NV</span><b>48</b></div><div class="kpi"><span class="muted">Đã HT</span><b>6%</b></div></div>`;}
function nqPage(){return `<div class="grid"><div class="kpi"><span class="muted">57-NQ/TW</span><b>1.840</b></div><div class="kpi"><span class="muted">NQ ĐH XIV</span><b>240</b></div></div>`;}
function partyPage(){const age=[["Dưới 30",310],["30–40",1100],["40–50",1380],["50–60",760],["Trên 60",1310]];const ten=[["Dưới 5 năm",610],["5–10",740],["10–15",820],["15–20",680],["20–30",880],["Trên 30",1130]];return `<p class="muted">DỮ LIỆU ĐẢNG VIÊN — tổng hợp mẫu, không PII, không gọi sotaydangvien.</p><div class="grid"><div class="kpi"><span class="muted">Tổng số</span><b>4.862.000</b></div><div class="kpi"><span class="muted">Nam</span><b>59,4%</b></div><div class="kpi"><span class="muted">Nữ</span><b>40,6%</b></div><div class="kpi"><span class="muted">Miễn sinh hoạt</span><b>348.000</b></div></div><div class="card"><h2>Theo tuổi đời <span class="tag">DỮ LIỆU MẪU</span></h2><table><tr><th>Nhóm</th><th>Mẫu</th></tr>${age.map(([l,n])=>`<tr><td>${l}</td><td>${n}</td></tr>`).join("")}</table></div><div class="card"><h2>Theo tuổi đảng</h2><table><tr><th>Nhóm</th><th>Mẫu</th></tr>${ten.map(([l,n])=>`<tr><td>${l}</td><td>${n}</td></tr>`).join("")}</table></div><div class="card"><p class="muted">Sinh hoạt: 194.000 chi bộ · 218.000 buổi. Ý kiến 41.200. Không danh sách tên.</p></div>`;}
function page(){const h=location.hash||"#/";const app=document.getElementById("app");if(!sessionStorage.getItem("ioc1")&&h!=="#/login"){location.hash="#/login";return;}if(h==="#/login"){app.innerHTML=`<main class="card"><h1>Đăng nhập hệ thống</h1><p class="muted">Không gửi Keycloak.</p><p><input id="u" value="demo.admin"/></p><button id="go">Đăng nhập</button></main>`;document.getElementById("go").onclick=()=>{sessionStorage.setItem("ioc1","1");location.hash="#/";};return;}if(h==="#/linked/mae-info"){location.hash="#/nnmt";return;}const pages={"#/":["TỔNG QUAN ĐIỀU HÀNH",home()],"#/socio-economic":["BÁO CÁO TÌNH HÌNH KINH TẾ - XÃ HỘI",sePage()],"#/operation-management":["TỔNG QUAN ĐIỀU HÀNH TÁC NGHIỆP",opsPage()],"#/hundred-day-plan":["KẾ HOẠCH 100 NGÀY",hdpPage()],"#/monitoring-resolution":["TỔNG QUAN THỰC HIỆN NGHỊ QUYẾT",nqPage()],"#/party-building":["DỮ LIỆU ĐẢNG VIÊN",partyPage()],"#/nnmt":["Thông tin Nông nghiệp và Môi trường","<div class='card'><p class='muted'>MAE-INFO chưa cấu hình URL</p><p><b>Hệ thống này chưa được cấu hình đúng.</b></p></div>"],"#/system-monitoring":["Giám sát hệ thống","<div class='card'>Stub → /Ship S8.</div>"],"#/admin/user":["Quản trị hệ thống","<div class='card'>Stub → /Ship S9.</div>"]};const [t,b]=pages[h]||["Không tìm thấy","<div class='card'>Hash ngoài phạm vi.</div>"];app.innerHTML=chrome(t,b);}
addEventListener("hashchange",page);if(!location.hash) location.hash="#/login";page();
</script></body></html>
