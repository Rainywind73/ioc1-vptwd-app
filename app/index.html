<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#B9000E" />
    <meta
      name="description"
      content="Bản nghiên cứu kiến trúc IOC-VPTWD — DỮ LIỆU MẪU, không kết nối SSO."
    />
    <title>Trung tâm điều hành giám sát thông minh VPTWD</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ioc1.theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="assets/logo_vptwd.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="banner" id="research-banner">
      BẢN NGHIÊN CỨU KIẾN TRÚC — DỮ LIỆU MẪU — không kết nối SSO / API ioc.dcs.vn
    </div>
    <div id="app"></div>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
