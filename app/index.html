<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Trung tâm điều hành giám sát thông minh VPTWD</title>
<style>
:root{--red:#B9000E;--navy:#17204A;--muted:#64748b;--bg:#f4f5f8;--line:#E5E8EF;--mae:#1B5E3B}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--navy)}
.banner{background:#7f1d1d;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:7px}
header.top{background:var(--red);color:#fff;padding:8px 12px 10px}
.t1{font-size:10px;opacity:.92}.t2{font-weight:800;font-size:13px}
nav.row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
nav.row a,nav.row button.navbtn{color:#fff;background:transparent;border:0;cursor:pointer;padding:6px 8px;border-radius:8px;font-size:12px;text-decoration:none}
nav.row a.on,nav.row button.navbtn.on{background:#8e0a12;font-weight:700}
.drop{position:relative}.menu{display:none;position:absolute;background:#fff;color:var(--navy);min-width:240px;border-radius:8px;box-shadow:0 8px 24px #0003;z-index:20;padding:6px}
.drop.open .menu{display:block}.menu a{display:block;color:var(--navy);padding:8px 10px;text-decoration:none}
main{max-width:1100px;margin:20px auto;padding:0 16px 48px}
.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.muted{color:var(--muted);font-size:13px}button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;margin-right:6px}
button.ghost{background:#fff;color:var(--navy);border:1px solid #cbd5e1}
.grid{display:grid;gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.kpi b{display:block;font-size:20px;margin:2px 0}
.up{color:#16a34a}.stamp{font-size:11px;color:var(--muted)}
.tag{background:#fff3f3;color:var(--red);font-size:11px;padding:2px 6px;border-radius:4px}
.mae{background:var(--mae);color:#fff;padding:8px 12px;border-radius:8px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tabs a{margin-right:12px}.tabs a.on{font-weight:800;color:var(--red)}
</style></head><body>
<div class="banner">BẢN NGHIÊN CỨU KIẾN TRÚC — DỮ LIỆU MẪU — không kết nối SSO / API ioc.dcs.vn</div>
<div id="app"></div>
<script>
function isOn(h,keys){return keys.some(k=>h===k||h.startsWith(k+"/"))}
function chrome(t,b){const h=location.hash||"#/";return `<header class="top"><div class="t1">VĂN PHÒNG TRUNG ƯƠNG ĐẢNG</div><div class="t2">TRUNG TÂM GIÁM SÁT, ĐIỀU HÀNH THÔNG MINH</div><nav class="row"><a class="${h==='#/'?'on':''}" href="#/">Trang chủ</a><a class="${h==='#/socio-economic'?'on':''}" href="#/socio-economic">Kinh tế - Xã hội</a><a class="${h==='#/operation-management'?'on':''}" href="#/operation-management">Điều hành tác nghiệp</a><div class="drop"><button class="navbtn ${isOn(h,['#/hundred-day-plan'])?'on':''}" type="button" data-dd="h100">Kế hoạch 100 ngày ▾</button><div class="menu"><a href="#/hundred-day-plan/political">Hệ thống chính trị</a><a href="#/hundred-day-plan/party">Cơ quan Đảng</a></div></div><a class="${h==='#/monitoring-resolution'?'on':''}" href="#/monitoring-resolution">Theo dõi nghị quyết</a><a class="${h==='#/party-building'?'on':''}" href="#/party-building">Dữ liệu Đảng viên</a><div class="drop"><button class="navbtn ${isOn(h,['#/linked-systems','#/nnmt'])?'on':''}" type="button" data-dd="nnmt">Dữ liệu về NNMT ▾</button><div class="menu"><a href="#/linked-systems/mae-info">MAE-INFO</a><a href="#/linked-systems/vnlis">CSDL đất đai</a></div></div><a class="${h==='#/system-monitoring'?'on':''}" href="#/system-monitoring">Giám sát hệ thống</a><div class="drop"><button class="navbtn ${h.startsWith('#/admin')?'on':''}" type="button" data-dd="adm">Quản trị ▾</button><div class="menu"><a href="#/admin/user">Người dùng</a></div></div></nav></header><main><p class="stamp">S2c đủ 6 khối · DỮ LIỆU MẪU</p><h1 style="font-size:20px">${t}</h1>${b}</main>`}
function bindNav(){document.querySelectorAll('[data-dd]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const p=btn.parentElement;document.querySelectorAll('.drop').forEach(d=>{if(d!==p)d.classList.remove('open')});p.classList.toggle('open')}});document.onclick=()=>document.querySelectorAll('.drop').forEach(d=>d.classList.remove('open'))}
function home(){return `<div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h2>KT-XH</h2><p><b class="up" style="font-size:28px">▲ 8,39%</b></p></div><div class="card"><h2>Đảng viên</h2><p><b style="font-size:28px">5.184.758</b></p></div><div class="card"><h2>NNMT</h2><p><a href="#/linked-systems/mae-info">MAE</a> · <a href="#/linked-systems/vnlis">VNLIS</a></p></div><div class="card"><h2>Giám sát</h2><p><a href="#/system-monitoring">Ứng dụng</a></p></div></div>`}
function sePage(){const rows=[["Hà Tĩnh","29.346","12,9%"],["Quảng Ninh","90.120","11,8%"],["Thái Nguyên","49.743","11,3%"],["Hải Phòng","175.610","11,2%"],["Bắc Ninh","138.614","11,1%"],["Phú Thọ","102.575","11,0%"],["Ninh Bình","87.153","10,9%"],["Hưng Yên","74.993","10,8%"],["Tây Ninh","77.907","10,4%"],["An Giang","55.020","10,3%"]];return `<p class="muted">Kỳ Tháng · 2026 · DỮ LIỆU MẪU</p><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><span class="muted">GDP</span><b class="up">8,39%</b></div><div class="kpi"><span class="muted">CPI</span><b>4,89%</b></div><div class="kpi"><span class="muted">IIP</span><b>14,41%</b></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="kpi"><span class="muted">Thu NSNN</span><b>150.400</b></div><div class="kpi"><span class="muted">Chi NSNN</span><b>238.100</b></div><div class="kpi"><span class="muted">Vốn NSNN</span><b>105.749,2</b></div><div class="kpi"><span class="muted">FDI</span><b>2.446,2</b></div><div class="kpi"><span class="muted">Xuất khẩu</span><b>54,8</b></div><div class="kpi"><span class="muted">Nhập khẩu</span><b>54,91</b></div><div class="kpi"><span class="muted">Giải ngân ĐTC</span><b>84.200</b></div><div class="kpi"><span class="muted">Vốn ĐKDN</span><b>189.396</b></div></div><div class="card"><h2>GRDP tỉnh <span class="tag">DỮ LIỆU MẪU</span></h2><table><tr><th>#</th><th>Địa phương</th><th>Tăng</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td class="up">${r[2]}</td></tr>`).join("")}</table><p class="muted">Không nhúng Viettel Maps</p></div>`;}
function opsPage(){return `<div class="kpi"><span class="muted">NV giao HT</span><b>2,8%</b></div>`}
function hdpPol(){return `<div class="kpi"><span class="muted">H100 CT</span><b>50 NV · 8%</b></div>`}
function hdpParty(){return `<div class="kpi"><span class="muted">H100 Đảng</span><b>52 NV · 38%</b></div>`}
function nqPage(){return `<div class="kpi"><span class="muted">57-NQ/TW</span><b>2.011</b></div>`}
function partyPage(){return `<div class="kpi"><span class="muted">Đảng viên</span><b>5.184.758</b></div>`}
function nnmtPage(){return `<div class="mae">MAE-INFO</div><p><a class="ghost" href="https://thongtinnnmt.mae.gov.vn/vn/Default.aspx" target="_blank" rel="noopener">Mở tab Bộ</a></p>`}
function vnlisPage(){return `<div class="kpi"><span class="muted">Tổng thửa</span><b>100.675.623</b></div>`}
function sysPage(){return `<p class="tabs"><a class="on" href="#/system-monitoring">Giám sát ứng dụng</a><a href="#/system-monitoring/infra">Hạ tầng</a></p><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><span class="muted">User</span><b>4.387.920</b></div><div class="kpi"><span class="muted">Lượt</span><b>2.846.099</b></div><div class="kpi"><span class="muted">Dùng HT</span><b>81,27</b></div></div>`}
function sysInfra(){return `<div class="card">Tab hạ tầng stub</div>`}
function adminPage(){return `<div class="card"><p>Cây 5 nhóm stub. demo.admin · demo.viewer. Không Keycloak.</p></div>`}
function page(){let h=location.hash||"#/";if(h==='#/nnmt'||h==='#/linked/mae-info')h='#/linked-systems/mae-info';if(h==='#/hundred-day-plan')h='#/hundred-day-plan/political';const app=document.getElementById("app");if(!sessionStorage.getItem("ioc1")&&h!=="#/login"){location.hash="#/login";return}if(h==="#/login"){app.innerHTML=`<main class="card"><h1>Đăng nhập</h1><p class="muted">Không Keycloak.</p><p><input id="u" value="demo.admin"/></p><button id="go">Vào</button></main>`;document.getElementById("go").onclick=()=>{sessionStorage.setItem("ioc1","1");location.hash="#/"};return}const pages={"#/":["TỔNG QUAN ĐIỀU HÀNH",home()],"#/socio-economic":["BÁO CÁO KT-XH",sePage()],"#/operation-management":["TÁC NGHIỆP",opsPage()],"#/hundred-day-plan/political":["H100 CT",hdpPol()],"#/hundred-day-plan/party":["H100 ĐẢNG",hdpParty()],"#/monitoring-resolution":["NQ",nqPage()],"#/party-building":["ĐẢNG VIÊN",partyPage()],"#/linked-systems/mae-info":["MAE-INFO",nnmtPage()],"#/linked-systems/vnlis":["CSDL ĐẤT ĐAI",vnlisPage()],"#/system-monitoring":["GIÁM SÁT",sysPage()],"#/system-monitoring/infra":["HẠ TẦNG",sysInfra()]};const [t,b]=h.startsWith("#/admin")?["QUẢN TRị",adminPage()]:(pages[h]||["404","<div class=card>Hash lạ</div>"]);app.innerHTML=chrome(t,b);bindNav()}
addEventListener("hashchange",page);if(!location.hash)location.hash="#/login";page();
</script></body></html>
