<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Trung tâm điều hành giám sát thông minh VPTWD</title>
<style>
:root{--red:#B9000E;--navy:#17204A;--muted:#64748b;--bg:#f4f5f8;--line:#E5E8EF}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--navy)}
.banner{background:#7f1d1d;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:7px}
header.top{background:var(--red);color:#fff;padding:8px 12px 10px}
.brand{display:flex;align-items:center;gap:10px}.star{font-size:22px}
.t1{font-size:10px;opacity:.92}.t2{font-weight:800;font-size:13px}
nav.row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center}
nav.row a,nav.row button.navbtn{color:#fff;background:transparent;border:0;cursor:pointer;padding:6px 8px;border-radius:8px;font-size:12px;text-decoration:none}
nav.row a.on,nav.row button.navbtn.on{background:#8e0a12;font-weight:700}
.drop{position:relative}.menu{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--navy);min-width:240px;border-radius:8px;box-shadow:0 8px 24px #0003;z-index:20;padding:6px}
.drop.open .menu{display:block}.menu a{display:block;color:var(--navy);padding:8px 10px;text-decoration:none;font-size:13px}
main{max-width:1100px;margin:20px auto;padding:0 16px 48px}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.muted{color:var(--muted);font-size:13px}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;margin-right:6px}
input,select{padding:6px 8px;border:1px solid #ddd;border-radius:8px}
.grid{display:grid;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:22px;margin:4px 0}
.up{color:#16a34a}.down{color:#dc2626}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;background:#fff3f3;color:var(--red);font-size:11px;padding:2px 6px;border-radius:4px}
.stamp{font-size:11px;color:var(--muted)}
.sec{font-size:14px;margin:16px 0 6px}
.mapph{background:#eef2ff;min-height:180px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
</style></head>
<body>
<div class="banner">BẢN NGHIÊN CỨU KIẾN TRÚC — DỮ LIỆU MẪU — không kết nối SSO / API ioc.dcs.vn</div>
<div id="app"></div>
<script>
function isOn(h,keys){return keys.some(k=>h===k||h.startsWith(k+"/"));}
function chrome(t,b){const h=location.hash||"#/";return `<header class="top"><div class="brand"><span class="star">★</span><div><div class="t1">VĂN PHÒNG TRUNG ƯƠNG ĐẢNG</div><div class="t2">TRUNG TÂM GIÁM SÁT, ĐIỀU HÀNH THÔNG MINH</div></div></div><nav class="row"><a class="${h==='#/'||h==='#'?'on':''}" href="#/">Trang chủ</a><a class="${h==='#/socio-economic'?'on':''}" href="#/socio-economic">Kinh tế - Xã hội</a><a class="${h==='#/operation-management'?'on':''}" href="#/operation-management">Điều hành tác nghiệp</a><div class="drop"><button class="navbtn ${isOn(h,['#/hundred-day-plan'])?'on':''}" type="button" data-dd="h100">Kế hoạch 100 ngày ▾</button><div class="menu"><a href="#/hundred-day-plan/political">Hệ thống chính trị</a><a href="#/hundred-day-plan/party">Cơ quan Đảng</a></div></div><a class="${h==='#/monitoring-resolution'?'on':''}" href="#/monitoring-resolution">Theo dõi nghị quyết</a><a class="${h==='#/party-building'?'on':''}" href="#/party-building">Dữ liệu Đảng viên</a><div class="drop"><button class="navbtn ${isOn(h,['#/nnmt','#/linked-systems','#/linked'])?'on':''}" type="button" data-dd="nnmt">Dữ liệu về NNMT ▾</button><div class="menu"><a href="#/linked-systems/mae-info">Thông tin NNMT (MAE-INFO)</a><a href="#/linked-systems/vnlis">CSDL đất đai</a></div></div><a class="${h==='#/system-monitoring'?'on':''}" href="#/system-monitoring">Giám sát hệ thống</a><div class="drop"><button class="navbtn ${h.startsWith('#/admin')?'on':''}" type="button" data-dd="adm">Quản trị hệ thống ▾</button><div class="menu"><a href="#/admin/user">Người dùng</a></div></div></nav></header><main><p class="stamp">S2c KT-XH · 22/09/2026 · DỮ LIỆU MẪU</p><h1 style="font-size:20px">${t}</h1>${b}</main>`;}
function bindNav(){document.querySelectorAll('[data-dd]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const p=btn.parentElement;document.querySelectorAll('.drop').forEach(d=>{if(d!==p)d.classList.remove('open');});p.classList.toggle('open');};});document.onclick=()=>document.querySelectorAll('.drop').forEach(d=>d.classList.remove('open'));}
function home(){return `<div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Chỉ tiêu kinh tế - xã hội</h2><p><b class="up" style="font-size:28px">▲ 8,39%</b></p><p class="muted">GDP Q2/2026 · DỮ LIỆU MẪU</p></div><div class="card"><h2>Dữ liệu Đảng viên</h2><p><b style="font-size:28px">5.184.758</b></p></div><div class="card"><h2>Theo dõi nghị quyết</h2><p><b style="font-size:28px">10</b></p></div><div class="card"><h2>Văn bản điện tử</h2><p>Đi <b>4.604</b> · Đến <b>26.867</b></p></div><div class="card"><h2>QLCV &amp; Đánh giá CB</h2><p class="muted">Chưa cấu hình URL.</p></div><div class="card"><h2>NNMT</h2><p><a href="#/linked-systems/vnlis">CSDL Đất đai</a> · <a href="#/linked-systems/mae-info">NN-MT</a></p></div><div class="card"><h2>H100</h2><p><a href="#/hundred-day-plan/party">Cơ quan Đảng</a> · <a href="#/hundred-day-plan/political">Hệ thống chính trị</a></p></div><div class="card"><h2>Giám sát</h2><p class="muted">Sổ tay · NQ · Tác nghiệp</p></div></div>`;}
function sePage(){
  const rows=[["Hà Tĩnh","29.346","12,9%"],["Quảng Ninh","90.120","11,8%"],["Thái Nguyên","49.743","11,3%"],["Hải Phòng","175.610","11,2%"],["Bắc Ninh","138.614","11,1%"],["Phú Thọ","102.575","11,0%"],["Ninh Bình","87.153","10,9%"],["Hưng Yên","74.993","10,8%"],["Tây Ninh","77.907","10,4%"],["An Giang","55.020","10,3%"]];
  return `<p class="muted">Bộ lọc: Kỳ <b>Tháng</b> · Năm <b>2026</b> · Đang <b>Theo kỳ</b>. Không phải số TCTK.</p>
  <div class="sec">1. Tăng trưởng và ổn định vĩ mô</div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><span class="muted">GDP</span><b class="up">8,39%</b></div><div class="kpi"><span class="muted">CPI</span><b class="up">4,89%</b></div><div class="kpi"><span class="muted">IIP</span><b class="up">14,41%</b></div></div>
  <div class="sec">2. Thu, chi NSNN</div>
  <div class="grid" style="grid-template-columns:1fr 1fr"><div class="kpi"><span class="muted">Thu NSNN</span><b>150.400</b><span class="muted">tỷ đồng</span></div><div class="kpi"><span class="muted">Chi NSNN</span><b>238.100</b><span class="muted">tỷ đồng</span></div></div>
  <div class="sec">3. Vốn đầu tư</div>
  <div class="grid" style="grid-template-columns:1fr 1fr"><div class="kpi"><span class="muted">Vốn NSNN</span><b>105.749,2</b></div><div class="kpi"><span class="muted">FDI</span><b>2.446,2</b><span class="muted">tỷ USD</span></div></div>
  <div class="sec">4. Xuất khẩu — Nhập khẩu</div>
  <div class="grid" style="grid-template-columns:1fr 1fr"><div class="kpi"><span class="muted">Xuất khẩu</span><b>54,8</b><span class="muted">tỷ USD</span></div><div class="kpi"><span class="muted">Nhập khẩu</span><b>54,91</b><span class="muted">tỷ USD</span></div></div>
  <div class="sec">5–6. Giải ngân ĐTC và DN đăng ký</div>
  <div class="grid" style="grid-template-columns:1fr 1fr"><div class="kpi"><span class="muted">Giải ngân đầu tư công</span><b>84.200</b></div><div class="kpi"><span class="muted">Vốn DN đăng ký</span><b>189.396</b></div></div>
  <div class="card"><h2>GRDP tỉnh/thành <span class="tag">DỮ LIỆU MẪU</span></h2>
    <div class="grid" style="grid-template-columns:1.2fr 1fr"><table><tr><th>#</th><th>Địa phương</th><th>GRDP</th><th>Tăng</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td class="up">${r[2]}</td></tr>`).join("")}</table><div class="mapph">Bản đồ GRDP — SVG nền, không nhúng Viettel Maps</div></div></div>`;}
function opsPage(){return `<div class="card"><p class="muted">Stub → /Ship S3c.</p></div>`;}
function hdpPol(){return `<div class="card"><p class="muted">Stub → /Ship S4c-pol.</p></div>`;}
function hdpParty(){return `<div class="card"><p class="muted">Stub → /Ship S4c-party.</p></div>`;}
function nqPage(){return `<div class="card"><p class="muted">Stub → /Ship S5c.</p></div>`;}
function partyPage(){return `<div class="card"><p class="muted">5.184.758 mẫu — không PII.</p></div>`;}
function nnmtPage(){return `<div class="card"><p><b>Hệ thống này chưa được cấu hình đúng.</b></p><p><a href="https://thongtinnnmt.mae.gov.vn/vn/Default.aspx" target="_blank" rel="noopener">Mở tab mới cổng Bộ</a></p></div>`;}
function vnlisPage(){return `<div class="card"><p class="muted">Stub → /Ship S7d.</p></div>`;}
function sysPage(){return `<div class="card"><p class="muted">Stub → /Ship S8c.</p></div>`;}
function adminPage(){return `<div class="card"><p class="muted">Stub S9. Không Keycloak.</p></div>`;}
function page(){const raw=location.hash||"#/";let h=raw;if(h==='#/nnmt'||h==='#/linked/mae-info')h='#/linked-systems/mae-info';if(h==='#/hundred-day-plan')h='#/hundred-day-plan/political';const app=document.getElementById("app");if(!sessionStorage.getItem("ioc1")&&h!=="#/login"){location.hash="#/login";return;}if(h==="#/login"){app.innerHTML=`<main class="card"><h1>Đăng nhập hệ thống</h1><p class="muted">Không gửi Keycloak.</p><p><input id="u" value="demo.admin"/></p><button id="go">Đăng nhập</button></main>`;document.getElementById("go").onclick=()=>{sessionStorage.setItem("ioc1","1");location.hash="#/";};return;}const pages={"#/":["TỔNG QUAN ĐIỀU HÀNH",home()],"#/socio-economic":["BÁO CÁO TÌNH HÌNH KINH TẾ - XÃ HỘI",sePage()],"#/operation-management":["TỔNG QUAN ĐIỀU HÀNH TÁC NGHIỆP",opsPage()],"#/hundred-day-plan/political":["KẾ HOẠCH 100 NGÀY · HỆ THỐNG CHÍNH TRỊ",hdpPol()],"#/hundred-day-plan/party":["KẾ HOẠCH 100 NGÀY · CƠ QUAN ĐẢNG",hdpParty()],"#/monitoring-resolution":["TỔNG QUAN THỰC HIỆN NGHỊ QUYẾT",nqPage()],"#/party-building":["DỮ LIỆU ĐẢNG VIÊN",partyPage()],"#/linked-systems/mae-info":["THÔNG TIN NÔNG NGHIỆP VÀ MÔI TRƯỜNG",nnmtPage()],"#/linked-systems/vnlis":["GIÁM SÁT TIẾN ĐỘ CSDL ĐẤT ĐAI",vnlisPage()],"#/system-monitoring":["GIÁM SÁT ỨNG DỤNG / HẠ TẦNG",sysPage()]};const [t,b]=h.startsWith("#/admin")?["QUẢN TRị HỆ THỐNG",adminPage()]:(pages[h]||["Không tìm thấy","<div class='card'>Hash ngoài phạm vi.</div>"]);app.innerHTML=chrome(t,b);bindNav();}
addEventListener("hashchange",page);if(!location.hash) location.hash="#/login";page();
</script></body></html>
