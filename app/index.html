<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Trung tâm điều hành giám sát thông minh VPTWD</title>
<style>
:root{--red:#B9000E;--navy:#17204A;--muted:#64748b;--bg:#f4f5f8;--line:#E5E8EF}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--navy)}
.banner{background:#7f1d1d;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:7px}
header.top{background:var(--red);color:#fff;padding:8px 12px 10px}
.t1{font-size:10px;opacity:.92}.t2{font-weight:800;font-size:13px}
nav.row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
nav.row a,nav.row button.navbtn{color:#fff;background:transparent;border:0;cursor:pointer;padding:6px 8px;border-radius:8px;font-size:12px;text-decoration:none}
nav.row a.on,nav.row button.navbtn.on{background:#8e0a12;font-weight:700}
.drop{position:relative}.menu{display:none;position:absolute;background:#fff;color:var(--navy);min-width:240px;border-radius:8px;box-shadow:0 8px 24px #0003;z-index:20;padding:6px}
.drop.open .menu{display:block}.menu a{display:block;color:var(--navy);padding:8px 10px;text-decoration:none}
main{max-width:1100px;margin:20px auto;padding:0 16px 48px}
.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.muted{color:var(--muted);font-size:13px}button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.grid{display:grid;gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.kpi b{display:block;font-size:20px;margin:2px 0}
.up{color:#16a34a}.warn{color:#dc2626}.stamp{font-size:11px;color:var(--muted)}
.tag{background:#fff3f3;color:var(--red);font-size:11px;padding:2px 6px;border-radius:4px}
.alert{background:#fff1f2;border:1px solid #fecdd3;border-radius:8px;padding:10px;font-size:13px}
.nq{font-size:12px}.nq b{font-size:16px}
.mapph{background:#eef2ff;min-height:140px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
</style></head><body>
<div class="banner">BẢN NGHIÊN CỨU KIẾN TRÚC — DỮ LIỆU MẪU — không kết nối SSO / API ioc.dcs.vn</div>
<div id="app"></div>
<script>
function isOn(h,keys){return keys.some(k=>h===k||h.startsWith(k+"/"))}
function chrome(t,b){const h=location.hash||"#/";return `<header class="top"><div class="t1">VĂN PHÒNG TRUNG ƯƠNG ĐẢNG</div><div class="t2">TRUNG TÂM GIÁM SÁT, ĐIỀU HÀNH THÔNG MINH</div><nav class="row"><a class="${h==='#/'?'on':''}" href="#/">Trang chủ</a><a class="${h==='#/socio-economic'?'on':''}" href="#/socio-economic">Kinh tế - Xã hội</a><a class="${h==='#/operation-management'?'on':''}" href="#/operation-management">Điều hành tác nghiệp</a><div class="drop"><button class="navbtn ${isOn(h,['#/hundred-day-plan'])?'on':''}" type="button" data-dd="h100">Kế hoạch 100 ngày ▾</button><div class="menu"><a href="#/hundred-day-plan/political">Hệ thống chính trị</a><a href="#/hundred-day-plan/party">Cơ quan Đảng</a></div></div><a class="${h==='#/monitoring-resolution'?'on':''}" href="#/monitoring-resolution">Theo dõi nghị quyết</a><a class="${h==='#/party-building'?'on':''}" href="#/party-building">Dữ liệu Đảng viên</a><div class="drop"><button class="navbtn ${isOn(h,['#/linked-systems','#/nnmt'])?'on':''}" type="button" data-dd="nnmt">Dữ liệu về NNMT ▾</button><div class="menu"><a href="#/linked-systems/mae-info">MAE-INFO</a><a href="#/linked-systems/vnlis">CSDL đất đai</a></div></div><a class="${h==='#/system-monitoring'?'on':''}" href="#/system-monitoring">Giám sát hệ thống</a><div class="drop"><button class="navbtn ${h.startsWith('#/admin')?'on':''}" type="button" data-dd="adm">Quản trị ▾</button><div class="menu"><a href="#/admin/user">Người dùng</a></div></div></nav></header><main><p class="stamp">S5c nghị quyết · DỮ LIỆU MẪU</p><h1 style="font-size:20px">${t}</h1>${b}</main>`}
function bindNav(){document.querySelectorAll('[data-dd]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const p=btn.parentElement;document.querySelectorAll('.drop').forEach(d=>{if(d!==p)d.classList.remove('open')});p.classList.toggle('open')}});document.onclick=()=>document.querySelectorAll('.drop').forEach(d=>d.classList.remove('open'))}
function home(){return `<div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h2>KT-XH</h2><p><b class="up" style="font-size:28px">▲ 8,39%</b></p></div><div class="card"><h2>Đảng viên</h2><p><b style="font-size:28px">5.184.758</b></p></div><div class="card"><h2>Nghị quyết</h2><p><b>10</b></p></div><div class="card"><h2>Văn bản</h2><p>Đi 4.604 · Đến 26.867</p></div></div>`}
function sePage(){return `<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><span class="muted">GDP</span><b class="up">8,39%</b></div><div class="kpi"><span class="muted">CPI</span><b>4,89%</b></div><div class="kpi"><span class="muted">IIP</span><b>14,41%</b></div></div>`}
function opsPage(){return `<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><span class="muted">NV giao HT</span><b>2,8%</b></div><div class="kpi"><span class="muted">Đến hạn</span><b>95,28%</b></div><div class="kpi"><span class="muted">Ký ĐT</span><b>53,32%</b></div></div>`}
function hdpPol(){return `<div class="grid" style="grid-template-columns:repeat(5,1fr)"><div class="kpi"><span class="muted">Tổng</span><b>50</b></div><div class="kpi"><span class="muted">HT</span><b class="up">8,0%</b></div><div class="kpi"><span class="muted">Quá hạn</span><b class="warn">8,0%</b></div><div class="kpi"><span class="muted">Chưa</span><b>0%</b></div><div class="kpi"><span class="muted">Còn</span><b>45 ngày</b></div></div>`}
function hdpParty(){return `<div class="grid" style="grid-template-columns:repeat(5,1fr)"><div class="kpi"><span class="muted">Tổng</span><b>52</b></div><div class="kpi"><span class="muted">HT</span><b class="up">38,0%</b></div><div class="kpi"><span class="muted">Quá hạn</span><b class="warn">19,2%</b></div><div class="kpi"><span class="muted">Chưa</span><b>0%</b></div><div class="kpi"><span class="muted">Còn</span><b>45 ngày</b></div></div>`}
function nqPage(){const cards=[["57-NQ/TW",2011,78,108,1343,482],["59-NQ/TW",115,3,19,15,78],["66-NQ/TW",84,1,11,42,30],["68-NQ/TW",120,9,43,67,1],["70-NQ/TW",118,17,70,27,4],["71-NQ/TW",73,0,34,38,1],["72-NQ/TW",51,0,18,9,24],["79-NQ/TW",107,2,36,2,67],["80-NQ/TW",136,2,45,10,79],["NQ ĐH XIV",275,10,193,29,43]];
return `<p class="muted">01/09–22/09/2026 · DỮ LIỆU MẪU · không đọc theodoinq</p>
<div class="grid" style="grid-template-columns:repeat(5,1fr)">${cards.map(([c,t,o,d,h,x])=>`<div class="kpi nq"><span class="muted">${c}</span><b>${t}</b><span class="muted">QH ${o} · Đang ${d} · HT ${h} · TX ${x}</span></div>`).join("")}</div>
<div class="alert">Cảnh báo nổi bật (ngưỡng 3%): QH phát triển DNNVV 100% · Vụ Nguồn nước 50% · Viện CLKT 100% · Ban BT 100%</div>
<div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Tiến độ theo đơn vị</h2><p class="muted">Bar mẫu: HT / Đang / Chậm / Thường xuyên</p></div><div class="card"><h2>Nhóm nhiệm vụ</h2><p>Nhóm 5 CĐS <b>729 (72,1%)</b><br>Nhóm 4 <b>156 (15,4%)</b><br>Nhóm 2 <b>126 (12,5%)</b></p><div class="mapph">Bản đồ NQ — không nhúng Viettel Maps</div></div></div>`}
function partyPage(){return `<div class="card">5.184.758 mẫu — không PII</div>`}
function nnmtPage(){return `<div class="card"><p><b>Chưa cấu hình đúng.</b></p><p><a href="https://thongtinnnmt.mae.gov.vn/vn/Default.aspx" target="_blank" rel="noopener">Mở tab Bộ</a></p></div>`}
function vnlisPage(){return `<div class="card">Stub S7d</div>`}
function sysPage(){return `<div class="card">Stub S8c</div>`}
function adminPage(){return `<div class="card">Stub S9 — không Keycloak</div>`}
function page(){let h=location.hash||"#/";if(h==='#/nnmt'||h==='#/linked/mae-info')h='#/linked-systems/mae-info';if(h==='#/hundred-day-plan')h='#/hundred-day-plan/political';const app=document.getElementById("app");if(!sessionStorage.getItem("ioc1")&&h!=="#/login"){location.hash="#/login";return}if(h==="#/login"){app.innerHTML=`<main class="card"><h1>Đăng nhập</h1><p class="muted">Không Keycloak.</p><p><input id="u" value="demo.admin"/></p><button id="go">Vào</button></main>`;document.getElementById("go").onclick=()=>{sessionStorage.setItem("ioc1","1");location.hash="#/"};return}const pages={"#/":["TỔNG QUAN ĐIỀU HÀNH",home()],"#/socio-economic":["BÁO CÁO KT-XH",sePage()],"#/operation-management":["TỔNG QUAN ĐIỀU HÀNH TÁC NGHIỆP",opsPage()],"#/hundred-day-plan/political":["H100 CHÍNH TRỊ",hdpPol()],"#/hundred-day-plan/party":["H100 ĐẢNG",hdpParty()],"#/monitoring-resolution":["TỔNG QUAN THỰC HIỆN NGHỊ QUYẾT",nqPage()],"#/party-building":["ĐẢNG VIÊN",partyPage()],"#/linked-systems/mae-info":["MAE-INFO",nnmtPage()],"#/linked-systems/vnlis":["CSDL ĐẤT ĐAI",vnlisPage()],"#/system-monitoring":["GIÁM SÁT",sysPage()]};const [t,b]=h.startsWith("#/admin")?["QUẢN TRị",adminPage()]:(pages[h]||["404","<div class=card>Hash lạ</div>"]);app.innerHTML=chrome(t,b);bindNav()}
addEventListener("hashchange",page);if(!location.hash)location.hash="#/login";page();
</script></body></html>
